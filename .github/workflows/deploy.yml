name: Build and deploy Resume to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-docx pillow

      - name: Build resume static site
        run: python build.py

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@latest pages project create alexander-sorrell-resume --production-branch=main || true
          npx --yes wrangler@latest pages deploy _site --project-name=alexander-sorrell-resume --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
